     A plataforma (Google Apps Script) abre em tela cheia aqui dentro,

     ===================================================================== */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6F4FA; font-family: Arial, Helvetica, sans-serif; }

  #base { position: fixed; inset: auto 0 0 0; height: env(safe-area-inset-bottom); background: #3E2A63; z-index: 2; }
  /* width:1px + min-width:100%: impede o iPhone de "esticar" o quadro além da largura da tela */
  #app { position: fixed; top: env(safe-area-inset-top); left: 0; bottom: env(safe-area-inset-bottom); width: 1px; min-width: 100%; max-width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); border: 0; display: block; background: #F6F4FA; }
  @media (prefers-color-scheme: dark) { html, body, #app { background: #17121F; } #topo, #base { background: #1F172E; } }
  #abre { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          background: linear-gradient(160deg, #3E2A63, #68489B); color: #fff; text-align: center; padding: 24px; transition: opacity .35s; }
  #abre.some { opacity: 0; pointer-events: none; }
  #abre img { width: 76px; height: 80px; }
  #abre b { font-size: 22px; letter-spacing: .02em; }
  #abre p { margin: 0; opacity: .85; font-size: 15px; max-width: 320px; line-height: 1.45; }
  .gira { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  button { font: bold 15px Arial, sans-serif; background: #fff; color: #3E2A63; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; }

<script>
  // >>> Link da plataforma: o link /exec da implantação do Apps Script (copie da barra de endereço, sem o "#painel" do fim)
  const PLATAFORMA = 'https://script.google.com/macros/s/AKfycbymmkn84_Y0xMr6WiaStxbgB_FW0MaKpm00CxBCF_9uTKnFc2Iu0wqB3p12ezZRtEiz/exec';

  const abre = document.getElementById('abre'), msg = document.getElementById('msg'), acao = document.getElementById('acao'), gira = document.getElementById('gira');
  function aviso(t, botao) { gira.style.display = 'none'; msg.textContent = t; acao.innerHTML = botao ? '<button onclick="location.reload()">' + botao + '</button>' : ''; }
  function abrir() {
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(PLATAFORMA)) return aviso('Configuração pendente: o link da plataforma ainda não foi colocado no arquivo app.html.');
    if (navigator.onLine === false) return aviso('Sem internet. Conecte-se e toque em Tentar de novo.', 'Tentar de novo');
    const q = new URLSearchParams(location.search); q.set('pwa', '1');
    const f = document.createElement('iframe');
    f.id = 'app'; f.title = 'Rotinas HSE';
    f.allow = 'camera; microphone; geolocation; clipboard-read; clipboard-write; web-share; fullscreen; autoplay';
    f.src = PLATAFORMA + '?' + q.toString() + location.hash;
    let ok = false;
    f.onload = () => { ok = true; abre.classList.add('some'); };
    document.body.appendChild(f);
    setTimeout(() => { if (!ok) aviso('A plataforma está demorando para abrir. Verifique a internet.', 'Tentar de novo'); }, 45000);
  }
  window.addEventListener('online', () => { if (!document.getElementById('app')) location.reload(); });
  abrir();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
